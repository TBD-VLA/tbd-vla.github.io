<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TBD Document Symbol</title>
  <desc id="desc">A clean document icon with a folded corner and the letters TBD clearly centered on the page.</desc>

  <!-- Transparent background -->
  <g fill="none" stroke="#111827" stroke-linejoin="round">
    <!-- Document body: unchanged paper size -->
    <path d="M112 48h192l96 96v320H112z" fill="#ffffff" stroke-width="20"/>

    <!-- Folded corner -->
    <path d="M304 48v96h96" fill="#e5e7eb" stroke-width="20"/>
  </g>

  <!-- Subtle page lines -->
  <g stroke="#9ca3af" stroke-width="16" stroke-linecap="round">
    <line x1="176" y1="340" x2="336" y2="340"/>
    <line x1="176" y1="386" x2="336" y2="386"/>
  </g>

  <!-- TBD text: larger, while keeping paper size unchanged and avoiding overlap -->
  <text x="256" y="252"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="116"
        font-weight="800"
        textLength="232"
        lengthAdjust="spacingAndGlyphs"
        fill="#111827">TBD</text>
</svg>
